[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prescription-ocr-api"
version = "0.1.0"
description = "Evidence-preserving prescription OCR and review API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "pillow>=11,<12",
  "opencv-python-headless>=4.10,<5",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
paddle = [
  "paddleocr>=2.8,<4",
  "paddlepaddle>=2.6,<4",
]
trocr = [
  "transformers>=4.44,<5",
  "torch>=2.2,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pglast>=7,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
